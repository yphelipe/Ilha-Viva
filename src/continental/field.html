<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#222d29"><title>Ilha Viva · Campo continental 02</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e5d7;color:#24352e;font:15px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:18px clamp(10px,3vw,32px) 22px}header,.bar,.sky,nav,.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:12px}h1{font:650 clamp(24px,4vw,42px)/1.1 Georgia,serif;letter-spacing:-.04em;margin:3px 0}header small{letter-spacing:.13em;text-transform:uppercase;font-weight:650;color:#536353}.sky{font-variant-numeric:tabular-nums}.sky span{border-left:1px solid #a9ad99;padding-left:12px}#scene{background:#37473a;border:2px solid #3d503e;position:relative;overflow:hidden}canvas{display:block;width:100%;height:clamp(310px,60svh,570px);image-rendering:pixelated;touch-action:none}.bar{justify-content:space-between;padding:10px 0}.pad{display:grid;grid-template-columns:repeat(3,43px);gap:2px}.pad button{padding:1px;font-size:22px;min-height:39px}.pad [data-dir=up]{grid-column:2}.pad [data-dir=left]{grid-column:1}.pad [data-dir=right]{grid-column:3;grid-row:2}.pad [data-dir=down]{grid-column:2;grid-row:2}button,.file{font:inherit;color:inherit;font-weight:650;padding:8px 12px;background:#f9f7ed;border:1px solid #acae9c;border-radius:5px;min-height:40px;cursor:pointer}button:focus-visible,.file:focus-within{outline:3px solid #b47235}button:active,button[aria-pressed=true]{background:#435d47;color:white}.pad button{touch-action:none;user-select:none}#next{background:#37573e;color:white;border-color:#37573e}details{border-top:1px solid #a6ad98;padding:8px 0}summary{cursor:pointer;font-weight:650}p{margin:6px 0;line-height:1.45}#place{font-family:Georgia,serif;font-size:clamp(18px,2.5vw,24px);margin:0}#cell{color:#445246}#feedback{min-height:1.3em}nav{margin-top:7px}.file input{position:absolute;width:1px;height:1px;opacity:0}@media(max-width:600px){main{padding-top:10px}.sky{gap:4px;font-size:13px}.sky span{padding-left:6px}.bar{align-items:center;gap:4px}.controls{gap:4px}.controls button{font-size:13px;padding:6px}canvas{height:clamp(265px,45svh,420px)}}@media(max-height:490px) and (orientation:landscape){canvas{height:54vh}main{padding-top:5px}header{margin-bottom:4px}}
.work{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.work h2{margin-right:auto!important}.work button{border-color:#889980}.bar{gap:8px}#agent,#stock{color:#4c5e4e;font-size:.92em}@media (max-width:600px){.bar{align-items:center}.controls{max-width:56%;justify-content:flex-end}}
</style></head><body><main><header><div><small>Ilha Viva · Apalaches</small><h1>Vale do Amieiro</h1></div><div class="sky"><strong id="date"></strong><span id="climate"></span></div></header>
<div id="scene"><canvas id="field" aria-label="Campo rural. Use as setas ou WASD para caminhar. Toque no terreno para observar o solo."></canvas></div>
<div class="bar"><div class="pad" aria-label="Caminhar"><button data-dir="up" aria-label="Norte">↑</button><button data-dir="left" aria-label="Oeste">←</button><button data-dir="down" aria-label="Sul">↓</button><button data-dir="right" aria-label="Leste">→</button></div><div class="controls"><button id="next">Avançar dia</button><button id="auto" aria-pressed="false">Tempo automático</button></div></div>
<div class="work"><h2 id="place"></h2><button id="plant">Plantar</button><button id="harvest">Colher</button></div><p id="stock"></p><p id="cell"></p><p id="agent"></p>
<details><summary>Caderno de campo e salvamento</summary><p>Use as setas ou WASD para caminhar e Shift para correr. Toque no chão para examinar uma célula de 10 m. O tempo automático avança um dia a cada seis segundos com o campo aberto.</p><nav><button id="save">Salvar</button><button id="load">Carregar</button><button id="export">Exportar arquivo</button><label class="file">Importar arquivo<input id="import" type="file" accept=".json,application/json"></label></nav></details>
<p id="feedback" role="status"></p>
<script>
"use strict";
@@SOURCES@@
</script></main></body></html>
